<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研究摘要預覽 — RT Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#058482; --teal-deep:#035352; --teal-ink:#003737; --teal-wash:#E8F3F2; --teal-line:#C6DFDD;
  --paper:#F4F7F6; --card:#FFF; --line:#E4ECEB; --line-2:#CFDCDA;
  --ink:#12312F; --ink-2:#4C6664; --ink-3:#657473;
  --sun:#B4485B; --sun-wash:#F6E7EA;
  --r-card:14px; --r-cell:10px; --r-chip:999px;
  --sh-card:0 1px 2px rgba(18,49,47,.05);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); line-height:1.78;
  font-family:'IBM Plex Sans','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:13.5px;
  -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums}
strong{font-weight:600;color:var(--teal-ink)}

.wrap{max-width:1020px;margin:0 auto;padding:0 18px 72px}

/* ── 頁首 ── */
.top{background:var(--card);border-bottom:1px solid var(--line);margin-bottom:26px}
.top__in{max-width:1020px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:10px}
.eyebrow{font-size:9.5px;font-weight:600;letter-spacing:.18em;color:var(--teal);text-transform:uppercase}
.top__t{font-size:14px;font-weight:700;color:var(--teal-ink);letter-spacing:.03em}

/* ── 標題區 ── */
.head{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--sh-card);padding:26px 28px 24px;position:relative;overflow:hidden}
.head::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:var(--r-chip);line-height:1.7;
  background:var(--teal-wash);color:var(--teal-deep);border:1px solid var(--teal-line)}
.chip--plain{background:transparent;color:var(--ink-3);border-color:var(--line-2);font-weight:500}
h1{font-size:clamp(18px,2.4vw,22px);line-height:1.45;margin:0;color:var(--teal-ink);
  letter-spacing:.01em;font-weight:700;text-wrap:balance}
.sub{font-size:13px;color:var(--ink-3);margin-top:4px;font-weight:500;letter-spacing:.02em}
.lead{margin-top:18px;padding:15px 17px;background:var(--teal-wash);border-radius:var(--r-cell);
  font-size:13.5px;font-weight:500;color:var(--teal-ink);line-height:1.8}

/* ── 版面 ── */
.grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media(min-width:880px){
  .grid{grid-template-columns:1fr 1fr}
  .grid > .span2{grid-column:1 / -1}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--sh-card);padding:22px 24px}
.card__h{display:flex;align-items:center;gap:7px;margin:0 0 14px;
  font-size:11px;font-weight:600;color:var(--teal);letter-spacing:.12em}
.ico{width:13px;height:13px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.card p{margin:0 0 11px;color:var(--ink-2)}
.card p:last-child{margin-bottom:0}
ul.list{margin:0;padding:0;list-style:none}
ul.list li{position:relative;padding-left:15px;margin-bottom:11px;color:var(--ink-2)}
ul.list li:last-child{margin-bottom:0}
ul.list li::before{content:"";position:absolute;left:2px;top:10px;width:4px;height:4px;
  border-radius:50%;background:var(--teal-line)}

/* 分組人數 */
.arms{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
.arm{display:flex;align-items:center;gap:14px;padding:12px 15px;border-radius:var(--r-cell);
  background:var(--paper);border:1px solid var(--line)}
.arm__n{font-size:19px;font-weight:600;color:var(--teal);line-height:1;font-variant-numeric:tabular-nums}
.arm__n small{font-size:10.5px;font-weight:500;color:var(--ink-3);margin-left:2px}
.arm__b{min-width:0;line-height:1.5}
.arm__name{font-size:13px;font-weight:600;color:var(--teal-ink)}
.arm__note{font-size:11.5px;color:var(--ink-3)}

/* 基本資料表 */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-cell);overflow:hidden}
.fact{background:var(--card);padding:10px 13px;line-height:1.5}
.fact__k{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.fact__v{font-size:13.5px;font-weight:600;color:var(--teal-ink);font-variant-numeric:tabular-nums;margin-top:1px}

/* 主要結果數字盤 */
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-cell);padding:16px}
.stat__label{font-size:10.5px;font-weight:600;color:var(--ink-3);text-align:center;letter-spacing:.1em;
  padding-bottom:11px;border-bottom:1px solid var(--line-2);margin-bottom:14px}
.stat__row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat__box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-cell);
  padding:14px 8px 12px;text-align:center}
.stat__name{font-size:11.5px;font-weight:600;color:var(--teal-ink);line-height:1.5;min-height:3em;
  display:flex;align-items:center;justify-content:center}
.stat__v{font-size:25px;font-weight:600;color:var(--teal);line-height:1.15;font-variant-numeric:tabular-nums}
.stat__sub{font-size:10.5px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.4}
.stat__eff{margin-top:14px;text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);
  font-variant-numeric:tabular-nums;line-height:1.5}
.stat__verdict{margin-top:5px;text-align:center;font-size:11px;color:var(--ink-3)}

/* 次族群亮點 */
.hl{border-color:var(--teal-line);background:linear-gradient(180deg,var(--teal-wash),var(--card) 62%)}
.hl .card__h{color:var(--teal-deep)}
.hl__t{font-size:14px;font-weight:700;color:var(--teal-ink);margin:0 0 11px;line-height:1.6}
.caveat{margin-top:14px;padding:12px 14px;border-radius:var(--r-cell);
  background:var(--sun-wash);border:1px solid #E9CBD2;font-size:12px;color:#7A2E3C;line-height:1.75}

/* RT 實務 */
.rt{border-color:var(--teal-line);box-shadow:inset 3px 0 0 var(--teal),var(--sh-card)}
.rt .card__h{color:var(--teal-deep)}
.rt ul.list li::before{background:var(--teal)}
.rt ul.list li{color:var(--ink);margin-bottom:13px}

/* 頁尾引用 */
.cite{margin-top:20px;padding-top:17px;border-top:1px solid var(--teal);
  font-size:11.5px;color:var(--ink-3);line-height:1.8}
.cite b{color:var(--ink-2)}
.cite a{color:var(--teal);text-decoration:none;font-weight:600}
.cite a:hover{text-decoration:underline}
.coi{margin-top:9px;font-size:12.5px;color:var(--ink-3);font-style:normal}
.err{padding:28px;text-align:center;color:var(--sun)}
</style>
</head>
<body>

<header class="top">
  <div class="top__in">
    <div>
      <div class="eyebrow">中榮呼吸治療科</div>
      <div class="top__t">研究摘要</div>
    </div>
  </div>
</header>

<main class="wrap" id="root"><div class="err">載入中…</div></main>

<script>
const ICONS = {
  why:'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
  who:'<path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3.2"/><path d="M21 20v-1.5a4 4 0 0 0-3-3.8"/>',
  how:'<path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="15" r="3"/>',
  found:'<path d="M4 19V5M4 19h16"/><path d="M8 15l3.5-4 3 2.5L20 8"/>',
  star:'<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17l-5.3 2.7 1.1-5.9L3.5 9.7l5.9-.8z"/>',
  shield:'<path d="M12 3.5l7 3v5c0 4.2-2.9 7.7-7 9-4.1-1.3-7-4.8-7-9v-5z"/><path d="M9.5 12l1.8 1.8 3.4-3.6"/>',
  bulb:'<path d="M9.5 18h5M10 21h4"/><path d="M8.5 14C7 12.8 6 11 6 9a6 6 0 0 1 12 0c0 2-1 3.8-2.5 5-.7.6-1 1.3-1 2.2h-5c0-.9-.3-1.6-1-2.2z"/>',
  warn:'<path d="M12 4.5L2.8 20h18.4z"/><path d="M12 10v4M12 17h.01"/>'
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24">${ICONS[n]||''}</svg>`;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md  = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const li  = arr => `<ul class="list">${arr.map(x => `<li>${md(x)}</li>`).join('')}</ul>`;
const card = (icon, title, body, cls='') =>
  `<section class="card ${cls}"><h2 class="card__h">${ico(icon)}${esc(title)}</h2>${body}</section>`;

function render(d) {
  const p = d.population, m = d.methods, k = d.keyStat;

  const head = `
    <section class="head">
      <div class="chips">
        ${d.journal ? `<span class="chip">${esc(d.journal)}</span>` : ''}
        ${d.designLabel ? `<span class="chip">${esc(d.designLabel)}</span>` : ''}
        ${(d.tags||[]).map(t => `<span class="chip chip--plain">${esc(t)}</span>`).join('')}
      </div>
      <h1>${esc(d.title)}</h1>
      ${d.titleSub ? `<div class="sub">${esc(d.titleSub)}</div>` : ''}
      <div class="lead">${md(d.oneLiner)}</div>
    </section>`;

  const who = `
    <div class="arms">
      ${p.arms.map(a => `
        <div class="arm">
          <div class="arm__n">${a.n}<small> 人</small></div>
          <div class="arm__b">
            <div class="arm__name">${esc(a.name)}</div>
            <div class="arm__note">${esc(a.note||'')}</div>
          </div>
        </div>`).join('')}
    </div>
    <p>${md(p.detail)}</p>
    <div class="facts">
      ${p.baseline.map(f => `<div class="fact"><div class="fact__k">${esc(f.label)}</div><div class="fact__v">${esc(f.value)}</div></div>`).join('')}
    </div>
    <p style="margin-top:13px;font-size:12.5px">${md(p.criteria)}</p>`;

  const how = `
    <p><b>設計：</b>${md(m.design)}</p>
    ${li(m.intervention)}
    <p style="margin-top:13px"><b>主要指標：</b>${md(m.primary)}<br><b>次要指標：</b>${md(m.secondaryList)}</p>
    <p style="color:var(--sun);font-size:12.5px">${md(m.note)}</p>`;

  const stat = `
    <div class="stat">
      <div class="stat__label">${esc(k.label)}</div>
      <div class="stat__row">
        ${[k.a, k.b].map(x => `
          <div class="stat__box">
            <div class="stat__name">${esc(x.name)}</div>
            <div class="stat__v">${esc(x.value)}</div>
            <div class="stat__sub">${esc(x.sub||'')}</div>
          </div>`).join('')}
      </div>
      <div class="stat__eff">${esc(k.effect)}</div>
      <div class="stat__verdict">兩組間無統計顯著差異</div>
    </div>
    <div style="margin-top:13px">${li(d.findings.primary)}</div>`;

  const hl = `
    <div class="hl__t">${esc(d.highlight.title)}</div>
    <p>${md(d.highlight.body)}</p>
    <div class="caveat">${md(d.highlight.caveat)}</div>`;

  return head + `<div class="grid">
    ${card('why','研究背景', `<p>${md(d.whyMatter)}</p>`)}
    ${card('found','主要結果', stat)}
    ${card('who','研究對象', who)}
    ${card('star','關鍵次族群', hl, 'hl')}
    ${card('how','研究方法', how)}
    ${card('shield','次要與安全性結果', li(d.findings.secondary) + '<div style="height:13px"></div>' + li(d.findings.safety))}
    ${card('bulb','結果詮釋', `<p>${md(d.meaning)}</p>`, 'span2')}
    ${card('star','本科臨床意涵', li(d.rtTakeaway), 'span2 rt')}
    ${card('warn','研究限制', li(d.limitations), 'span2')}
  </div>
  <div class="cite">
    <b>出處：</b>${esc(d.citation.authors)}. ${esc(d.citation.text)}
    　<a href="${esc(d.citation.url)}" target="_blank" rel="noopener">doi:${esc(d.citation.doi)}</a><br>
    <b>試驗註冊：</b>${esc(d.citation.registry)}　<b>線上發表：</b>${esc(d.citation.published)}
    ${d.coi ? `<div class="coi"><b>利益揭露：</b>${md(d.coi)}</div>` : ''}
    <div class="coi">本摘要係中榮呼吸治療科內部教學整理（整理者：${esc(d.reader||'—')}，${esc(d.date)}），非原文之翻譯；臨床決策應以原文為準。</div>
  </div>`;
}

fetch('data/papers/2026-eitvent.json')
  .then(r => r.json())
  .then(d => { document.getElementById('root').innerHTML = render(d); document.title = d.title + ' — 研究摘要'; })
  .catch(e => { document.getElementById('root').innerHTML = '<div class="err">載入失敗：' + e.message + '</div>'; });
</script>
</body>
</html>
